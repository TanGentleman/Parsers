[project]
name = "parsers"
version = "0.1.0"
description = "Turn the HTML tables on a web page or in a file into CSV files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["lxml>=6.0", "pandas>=3.0"]

[project.scripts]
parsers = "parsers.cli:run"

[dependency-groups]
dev = ["pytest>=9.0", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parsers"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src"]
